<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>铁锋 · 战场声音库</title><link rel="icon" href="data:,"><style>body{background:#060c16;color:#d6e4f1;font:15px/1.7 'Microsoft YaHei',sans-serif;margin:0}main{max-width:1200px;margin:auto;padding:34px 24px}a{color:#8fbdeb}h1{font-size:30px;margin:8px 0}p,small{color:#9aafc6}nav{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0}button,select{background:#15273c;color:#d9e9f7;border:1px solid #294664;padding:9px 14px;font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #9bc4ef;outline-offset:2px}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #22334a;padding:12px 10px;vertical-align:top}td:first-child{max-width:360px;overflow-wrap:anywhere}th{color:#9ab5d0}audio{width:210px;max-width:100%;height:32px}#player{padding:16px 0;border-top:1px solid #29425e}#rows button{white-space:nowrap}.table-wrap{overflow-x:auto}@media(max-width:650px){main{padding:24px 14px}td,th{padding:10px 6px;font-size:12px}th:nth-child(3),td:nth-child(3){display:none}}</style></head><body><main><small>IRONFRONT / SOUND LIBRARY</small><h1>战场声音库</h1><p id="summary">正在读取素材清单…</p><nav><a href="/src/intro.html">播放开场</a><a href="/">进入游戏</a><a href="/src/audio/credits.html">声音署名与许可</a></nav><label>筛选用途 <select id="filter"><option value="all">全部独立素材</option><option value="intro">开场随机池</option><option value="deploy">部署</option><option value="attack">进攻</option><option value="death">战死 / 伤亡</option><option value="rout">溃散 / 危急喊话</option><option value="alert">战场报告</option><option value="victory">战果</option></select></label><div id="player"><b id="playing" aria-live="polite">选一条试听</b><br><audio id="audio" controls preload="none"></audio></div><p>每行是一份独立录音文件。同一文件可用于多个情境，分类数量不可相加。真人口令、电台通信和非语言呼喊混合收录，并非全部来自实战。源文件保留原内容，部分台词含粗口。</p><div class="table-wrap"><table><thead><tr><th>录音</th><th>用途</th><th>作者 / 许可 / 原页</th><th>试听</th></tr></thead><tbody id="rows"></tbody></table></div></main><script type="module">
import { SOUND_LIBRARY } from './battle-catalog.js';
const labels={intro:'开场',deploy:'部署',attack:'进攻',death:'伤亡',rout:'溃散 / 危急',alert:'报告',victory:'战果'},filter=document.querySelector('#filter'),audio=document.querySelector('#audio');
function render(){const items=SOUND_LIBRARY.filter(a=>filter.value==='all'||a.categories.includes(filter.value));document.querySelector('#summary').textContent=`${SOUND_LIBRARY.length} 个独立录音 · 当前分类 ${items.length} 条 · 点击试听可逐条挑选`;const rows=document.querySelector('#rows');rows.replaceChildren();for(const a of items){const tr=document.createElement('tr'),title=document.createElement('td'),kind=document.createElement('td'),source=document.createElement('td'),action=document.createElement('td');title.textContent=a.title;kind.textContent=a.categories.map(c=>labels[c]).join(' / ');const origin=document.createElement('a'),license=document.createElement('a');origin.href=a.source;origin.textContent=a.author;origin.target='_blank';origin.rel='noopener';license.href=a.license_url;license.textContent=a.license;license.target='_blank';license.rel='noopener';source.append(origin,document.createElement('br'),license);const button=document.createElement('button');button.textContent='试听';button.onclick=()=>{audio.src='/src/audio/library/'+a.file;audio.play().catch(()=>{document.querySelector('#playing').textContent='播放失败，请检查音频设备';});document.querySelector('#playing').textContent=a.title;};action.append(button);tr.append(title,kind,source,action);rows.append(tr);}}
filter.onchange=render;render();
</script></body></html>
