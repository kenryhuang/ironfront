<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1939 · 像素船只与建筑预览</title>
<style>body{margin:0;background:#10181d;color:#d7dedb;font:14px system-ui}header,footer{max-width:1100px;margin:auto;padding:18px 24px}h1{font-size:23px;font-weight:500;margin:0 0 8px}p{color:#95aaa9;margin:5px 0}a{color:#d1bd8d}canvas{display:block;width:min(1100px,100%);height:auto;margin:auto;border-block:1px solid #405158}button{background:#293a41;color:#dae0dc;border:1px solid #64736f;padding:8px 12px;margin-right:12px}output{color:#b3cbbb}</style>
<header><h1>1939 / 俯视像素风</h1><p>游戏共用像素精灵 · 贸易货轮 / 港口 / 工厂 / 航迹水花 · 无烟雾</p></header>
<canvas width="1100" height="620" aria-label="像素货轮及建筑动态预览"></canvas>
<footer><button id="motion">暂停动画</button><output id="cost"></output><p>右下角为货轮像素放大镜；主场景维持游戏尺寸。此页仅验证美术，不推进游戏。</p><a href="../../game.html?campaign=1939&build=pixel-front">进入1939战役</a></footer>
<script type="module">
import {WarVisuals} from '../../src/territory-1939/war-visuals.js';
import {drawPixelIcon} from '../../src/territory-1939/pixel-art.js';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),fx=new WarVisuals(),readout=document.querySelector('output');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let paused=reduced,time=15,last=performance.now(),sum=0,frames=0,lastReport=last;
const button=document.querySelector('button');const label=()=>button.textContent=paused?'播放动画':'暂停动画';label();button.onclick=()=>{paused=!paused;label();};
const locations=new Map([[1,[160,310]],[2,[250,360]],[3,[820,195]],[4,[875,245]]]);
const point=t=>locations.get(t)??[t%360,Math.floor(t/360)];
const ships=Array.from({length:5},(_,i)=>{const path=[];for(let j=0;j<90;j++){const id=1000+i*100+j;locations.set(id,[330+j*5.2,320+i*27+Math.sin(j*.04+i)*30]);path.push(id);}return{id:i,from:0,path,distance:0};});
function block(x,y,w,h){c.fillStyle='#434b49';c.fillRect(x,y,w,h);c.fillStyle='#767b6e';c.beginPath();c.moveTo(x,y);c.lineTo(x+9,y-8);c.lineTo(x+w+9,y-8);c.lineTo(x+w,y);c.fill();c.fillStyle='#303c3d';c.beginPath();c.moveTo(x+w,y);c.lineTo(x+w+9,y-8);c.lineTo(x+w+9,y+h-8);c.lineTo(x+w,y+h);c.fill();for(let i=6;i<w;i+=13){c.fillStyle='#b19a64';c.fillRect(x+i,y+7,5,6);}}
function frame(now){requestAnimationFrame(frame);if(document.hidden){last=now;return;}if(now-last<33)return;const elapsed=Math.min(.1,(now-last)/1000);last=now;if(!paused)time+=elapsed;const start=performance.now();
 c.fillStyle='#243945';c.fillRect(0,0,1100,620);c.strokeStyle='#6e959218';c.lineWidth=1;for(let y=230;y<610;y+=19){c.beginPath();for(let x=0;x<1100;x+=16){const yy=y+Math.sin(x*.024+y+time*.2)*2;if(x===0)c.moveTo(x,yy);else c.lineTo(x,yy);}c.stroke();}
 c.fillStyle='#4a5148';c.beginPath();c.moveTo(0,0);c.lineTo(1100,0);c.lineTo(1100,285);c.lineTo(950,295);c.lineTo(900,260);c.lineTo(700,205);c.lineTo(540,215);c.lineTo(365,270);c.lineTo(315,395);c.lineTo(210,425);c.lineTo(0,390);c.closePath();c.fill();
 c.strokeStyle='#99a18c';c.lineWidth=2;c.stroke();c.fillStyle='#687062';for(let i=0;i<3;i++){c.fillRect(255+i*20,375,10,95-i*15);}
 drawPixelIcon(c,'factory',160,310,40);drawPixelIcon(c,'factory',250,360,40);drawPixelIcon(c,'port',290,400,40);
 c.fillStyle='#b7bda9';c.font='12px system-ui';c.fillText('工业区',96,430);c.fillText('陆地',790,290);c.fillText('贸易航线 / 游戏实际尺寸',460,460);
 for(const ship of ships){ship.distance=(time*1.8+ship.id*17)%89;fx.drawMerchant(c,ship,{point,w:1100,h:620,scale:12,time,reduced:paused});}
 c.save();c.translate(880,520);c.scale(3.2,3.2);fx.drawMerchant(c,{id:12,path:[0,1],distance:.5},{point:t=>[t*30-15,t*9-4.5],w:150,h:150,scale:16,time,reduced:paused});c.restore();c.fillStyle='#aebbb3';c.fillText('船体细节 ×3.2',930,595);
 sum+=performance.now()-start;frames++;if(now-lastReport>1000){readout.textContent=`表现层 ${ (sum/frames).toFixed(2)} ms / 帧`;sum=0;frames=0;lastReport=now;}
}requestAnimationFrame(frame);
</script></html>
